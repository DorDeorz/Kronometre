name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm (ör. 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Derle
        run: ./gradlew assembleRelease
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-smoke-logcat
          path: smoke/
          if-no-files-found: ignore

  release:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret eksik"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KRONOMETRE_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Sürüm
        run: |
          VERSION="${{ inputs.version }}"
          [ -n "$VERSION" ] || VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Build AAB + APK
        env:
          KRONOMETRE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KRONOMETRE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KRONOMETRE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew --stacktrace lint testDebugUnitTest bundleRelease assembleRelease
          -PappVersionName=$VERSION
          -PappVersionCode=$((100 + GITHUB_RUN_NUMBER))
      - name: Dosya adları
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Kronometre-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/Kronometre-$VERSION.aab"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Kronometre ${{ env.VERSION }}
          generate_release_notes: true
