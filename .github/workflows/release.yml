name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret eksik"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KRONOMETRE_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build AAB + APK
        env:
          KRONOMETRE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KRONOMETRE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KRONOMETRE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew --stacktrace lint testDebugUnitTest bundleRelease assembleRelease
          -PappVersionName=${GITHUB_REF_NAME#v}
          -PappVersionCode=$((100 + GITHUB_RUN_NUMBER))
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
