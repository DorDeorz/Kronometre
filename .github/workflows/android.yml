name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint, test
        run: ./gradlew --stacktrace assembleDebug assembleRelease lint testDebugUnitTest
      - name: APK boyutu
        run: ls -l app/build/outputs/apk/release/*.apk | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kronometre-apk-ve-raporlar
          path: |
            app/build/outputs/apk/
            app/build/reports/
          if-no-files-found: ignore
